<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>브랜딩 마켓 | WERACLE</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 50px 24px 40px;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
        }
        .icon-box {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: #e0f2fe;
            color: #0284c7;
            display: inline-flex;
            align-items: flex-start;
            justify-content: center;
            margin-bottom: 24px;
        }
        .icon-box svg {
            width: 32px;
            height: 32px;
        }
        .badge {
            display: inline-block;
            padding: 6px 14px;
            background: #f1f5f9;
            color: #475569;
            font-size: 13px;
            font-weight: 700;
            border-radius: 9999px;
            margin-bottom: 16px;
            letter-spacing: -0.2px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 15px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 32px;
            word-break: keep-all;
        }
        .info-card {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            padding: 16px;
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
        </div>
        <div class="badge">서비스 안내</div>
        <h1>브랜딩 마켓 신규 오픈 준비 중</h1>
        <p>
            현재 새로운 브랜딩 마켓 페이지를 제작 중입니다.<br>
            더욱 다양하고 전문적인 맞춤형 브랜딩 콘텐츠로 곧 찾아뵙겠습니다.
        </p>
        <div class="info-card">
            신규 페이지 제작 완료 후 해당 메뉴에 정식 연결될 예정입니다.
        </div>
    </div>
</body>
</html>
