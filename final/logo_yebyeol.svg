<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ybGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b66"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 둥근 사각형 베이스 배지 -->
  <rect width="120" height="120" rx="26" fill="url(#ybGrad)"/>
  <rect x="2" y="2" width="116" height="116" rx="24" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>

  <!-- 예별 상징 별빛 엠블럼 -->
  <g transform="translate(60, 44)">
    <!-- 주 광채 (4각 별) -->
    <path d="M0,-25 Q0,-4 20,0 Q0,4 0,25 Q0,4 -20,0 Q0,-4 0,-25 Z" fill="url(#starGrad)" filter="url(#softGlow)"/>
    <!-- 보조 광채 (대각선 4각 별) -->
    <path d="M0,-14 Q0,-2.5 12,0 Q0,2.5 0,14 Q0,2.5 -12,0 Q0,-2.5 0,-14 Z" fill="#ffffff" transform="rotate(45)" opacity="0.9"/>
    <!-- 중앙 코어 -->
    <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
  </g>

  <!-- '예별' 볼드 로고 타이포그래피 -->
  <text x="60" y="98" text-anchor="middle" font-family="'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-1">예별</text>
</svg>
