<!DOCTYPE html>

  <title>Branding Images Preview</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: #1e293b; border-radius: 12px; overflow: hidden; padding: 12px; border: 1px solid #334155; }
    .card img { width: 100%; height: 220px; object-fit: contain; background: #0b0f19; border-radius: 8px; }
    .title { font-weight: bold; margin-top: 10px; font-size: 16px; color: #38bdf8; }
  </style>
</head>
