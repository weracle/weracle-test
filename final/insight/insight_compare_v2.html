  <style>
    :root {
      --primary: #113f67;
      --primary-hover: #0a253d;
      --title-blue: #0284c7;
      --accent-blue: #0284c7;
      --accent-green: #059669;
      --bg-body: #f5f5f7;
      --border: rgba(0, 0, 0, 0.08);
      --text-main: #1d1d1f;
      --text-sub: #86868b;
      --bg-main: radial-gradient(circle at 50% 30%, #f4f8fc 0%, #e2edf7 100%);
    }

    * {
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      letter-spacing: -0.015em;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-main);
      color: #1e293b;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .font-brand {
      font-family: 'Outfit', 'Pretendard', sans-serif;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* Loader Pulse */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin 1s linear infinite;
    }
  </style>
</head>

      ]},
      { category: '주택화재', items: [
        { name: '주택화재 (급배수누출누수)', url: 'https://weraclelab.imweb.me/46?sheet=주택화재_급배수누출누수' }
      ]},
      { category: '펫보험', items: [
        { name: '펫보험', url: 'https://weraclelab.imweb.me/46?sheet=펫보험' }
      ]},
      { category: '골프보험', items: [
        { name: '골프보험', url: 'https://weraclelab.imweb.me/46?sheet=골프보험' }
      ]},
      { category: '기타', items: [
        { name: '치매진단비', url: 'https://weraclelab.imweb.me/46?sheet=치매진단비' }
      ]}
    ];

    const groups = [
      { name: "건강/질병", cats: ["3대진단비", "3대 치료비/생활비", "수술비", "치아", "종합질병&상해", "기타 치료비"] },
      { name: "생애/간병", cats: ["치매간병", "간병인", "종신", "연금", "태아플랜"] },
      { name: "실손/간편", cats: ["단독실손", "간편보험", "입원일당"] },
      { name: "생활/레저", cats: ["운전자", "주택화재", "펫보험", "골프보험", "기타"] }
    ];

    let currentGroup = groups[0].name;
    let currentCat = groups[0].cats[0];
    let currentUrl = menuData.find(c => c.category === currentCat).items[0].url;
    let currentItemName = menuData.find(c => c.category === currentCat).items[0].name;
    let isMapOpen = false;

    function getGroupItemCount(groupName) {
      const g = groups.find(x => x.name === groupName);
      if (!g) return 0;
      let count = 0;
      g.cats.forEach(c => {
        const catObj = menuData.find(m => m.category === c);
        if (catObj && catObj.items) count += catObj.items.length;
      });
      return count;
    }

    // Toggle Category Map Popover
    function toggleCategoryMap(groupName) {
      if (currentGroup === groupName && isMapOpen) {
        isMapOpen = false;
      } else {
        currentGroup = groupName;
        isMapOpen = true;
      }
      renderUI();
    }

    function closeCategoryMap() {
      if (isMapOpen) {
        isMapOpen = false;
        renderUI();
      }
    }

    function selectSheetItem(cat, name, url) {
      currentCat = cat;
      const g = groups.find(x => x.cats.includes(cat));
      if (g) currentGroup = g.name;
      currentItemName = name;
      currentUrl = url;
      isMapOpen = false;
      renderUI();
    }

    // Main Render Function
    function renderUI() {
      // 1. Render Header Category Tabs
      const tabsContainer = document.getElementById('headerTabsContainer');
      tabsContainer.innerHTML = '';
      groups.forEach(g => {
        const isSelected = (g.name === currentGroup);
        const count = getGroupItemCount(g.name);

        const tabBtn = document.createElement('button');
        tabBtn.onclick = (e) => {
          e.stopPropagation();
          toggleCategoryMap(g.name);
        };

        if (isSelected) {
          tabBtn.className = "px-4 py-2 rounded-xl text-xs font-black transition-all cursor-pointer flex items-center gap-1.5 bg-[#0284c7] text-white shadow-sm ring-2 ring-[#0284c7]/20";
          tabBtn.innerHTML = `
            <span>${g.name}</span>
            <span class="text-[10px] px-1.5 py-0.2 rounded-full bg-white/25 text-white font-mono">${count}</span>
            <span class="text-[10px] opacity-80">${isMapOpen ? '▲' : '▾'}</span>
          `;
        } else {
          tabBtn.className = "px-4 py-2 rounded-xl text-xs font-bold transition-all cursor-pointer flex items-center gap-1.5 text-slate-600 hover:text-slate-950 hover:bg-white";
          tabBtn.innerHTML = `
            <span>${g.name}</span>
            <span class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-200/80 text-slate-600 font-mono">${count}</span>
            <span class="text-[10px] opacity-60">▾</span>
          `;
        }
        tabsContainer.appendChild(tabBtn);
      });

      // 2. Update Header Badges and Text
      document.getElementById('activeBadgeName').innerText = currentItemName;
      document.getElementById('currentPathText').innerText = `${currentGroup} > ${currentCat} > ${currentItemName}`;

      // 3. Render Mega Overlay (선택된 카테고리의 소분류들만 벤토 그리드로 정돈)
      const overlay = document.getElementById('categoryMegaOverlay');
      if (isMapOpen) {
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');

        const activeGroupObj = groups.find(g => g.name === currentGroup);
        const totalCount = getGroupItemCount(currentGroup);

        document.getElementById('popoverGroupBadge').innerText = currentGroup;
        document.getElementById('popoverGroupTitle').innerText = `한장비교표 세부 맵 (${totalCount}개 담보)`;

        // In-popover fast group switchers
        const switchers = document.getElementById('popoverGroupSwitchers');
        switchers.innerHTML = '';
        groups.forEach(g => {
          const sBtn = document.createElement('button');
          sBtn.onclick = (e) => {
            e.stopPropagation();
            currentGroup = g.name;
            renderUI();
          };
          if (g.name === currentGroup) {
            sBtn.className = "px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer bg-[#113f67] text-white shadow-xs";
          } else {
            sBtn.className = "px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-600";
          }
          sBtn.innerText = g.name.split('/')[0];
          switchers.appendChild(sBtn);
        });

        // Grid Columns based on count of subcategories
        const grid = document.getElementById('popoverBentoGrid');
        grid.innerHTML = '';
        const colCount = activeGroupObj.cats.length <= 4 ? 'grid-cols-2 md:grid-cols-4' : 'grid-cols-2 md:grid-cols-3 lg:grid-cols-6';
        grid.className = `grid ${colCount} gap-3.5`;

        activeGroupObj.cats.forEach(c => {
          const catObj = menuData.find(x => x.category === c);
          const isSelectedCat = (c === currentCat);

          const card = document.createElement('div');
          card.className = `rounded-2xl border ${isSelectedCat ? 'border-[#bfdbfe] bg-[#eff6ff]/35 shadow-sm' : 'border-slate-200/90 bg-slate-50/70'} p-3.5 flex flex-col gap-2 transition-all`;

          let itemsHtml = catObj.items.map(item => {
            const isItemActive = (item.url === currentUrl);
            return `
              <button onclick="selectSheetItem('${c}', '${item.name}', '${item.url}')" class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs truncate cursor-pointer transition-all flex items-center justify-between ${isItemActive ? 'bg-[#0284c7] text-white font-extrabold shadow-xs' : 'text-slate-600 hover:bg-white hover:text-[#0284c7] hover:shadow-2xs'}">
                <span class="truncate">${item.name}</span>
                ${isItemActive ? '<span class="text-[9px] font-black">열람중</span>' : ''}
              </button>
            `;
          }).join('');

          card.innerHTML = `
            <div class="flex items-center justify-between pb-2 border-b ${isSelectedCat ? 'border-[#bfdbfe]' : 'border-slate-200'}">
              <span class="font-black text-xs ${isSelectedCat ? 'text-[#0284c7]' : 'text-slate-800'}">${c}</span>
              <span class="text-[10px] font-bold px-1.5 py-0.2 rounded-full ${isSelectedCat ? 'bg-white text-[#0284c7] border border-[#bfdbfe]' : 'bg-slate-200 text-slate-600'} font-mono">${catObj.items.length}</span>
            </div>
            <div class="space-y-1">
              ${itemsHtml}
            </div>
          `;
          grid.appendChild(card);
        });

      } else {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      }

      // 4. Update Iframe Source
      const iframe = document.getElementById('insightFrame');
      if (iframe.src !== currentUrl) {
        showLoader();
        iframe.src = currentUrl;
      }
    }

    // Frame Helpers
    function showLoader() {
      const loader = document.getElementById('frameLoader');
      if (loader) {
        loader.classList.remove('hidden');
        loader.style.opacity = '1';
      }
    }

    function onFrameLoaded() {
      const loader = document.getElementById('frameLoader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.classList.add('hidden'), 300);
      }
    }

    function reloadFrame() {
      const iframe = document.getElementById('insightFrame');
      if (iframe) {
        showLoader();
        iframe.src = currentUrl;
      }
    }

    function openCurrentInNewTab() {
      if (currentUrl) {
        window.open(currentUrl, '_blank');
      }
    }

    // Quick Search Logic
    function onQuickSearch() {
      const input = document.getElementById('quickSearchInput');
      const overlay = document.getElementById('searchResultsOverlay');
      const listEl = document.getElementById('searchResultsList');
      const countEl = document.getElementById('searchResultCount');

      const query = (input.value || '').trim().toLowerCase();

      if (!query) {
        overlay.classList.add('hidden');
        return;
      }

      const matches = [];
      menuData.forEach(catObj => {
        catObj.items.forEach(item => {
          if (item.name.toLowerCase().includes(query) || catObj.category.toLowerCase().includes(query)) {
            const grp = groups.find(g => g.cats.includes(catObj.category));
            matches.push({
              group: grp ? grp.name : '',
              category: catObj.category,
              name: item.name,
              url: item.url
            });
          }
        });
      });

      countEl.innerText = matches.length;
      listEl.innerHTML = '';

      if (matches.length === 0) {
        listEl.innerHTML = `<span class="text-xs text-slate-400">일치하는 비교표가 없습니다.</span>`;
      } else {
        matches.forEach(m => {
          const btn = document.createElement('button');
          btn.className = "px-2.5 py-1 rounded-md bg-white border border-[#bfdbfe] text-xs font-semibold text-[#113f67] hover:bg-[#0284c7] hover:text-white transition-all cursor-pointer flex items-center gap-1 shadow-xs";
          btn.innerHTML = `<span class="text-[10px] text-slate-400 font-normal">[${m.category}]</span> <span>${m.name}</span>`;
          btn.onclick = () => {
            selectSheetItem(m.category, m.name, m.url);
            clearQuickSearch();
          };
          listEl.appendChild(btn);
        });
      }

      overlay.classList.remove('hidden');
    }

    function clearQuickSearch() {
      const input = document.getElementById('quickSearchInput');
      const overlay = document.getElementById('searchResultsOverlay');
      input.value = '';
      overlay.classList.add('hidden');
    }

    // Event Listener for Frame Loading
    const frameEl = document.getElementById('insightFrame');
    if (frameEl) {
      frameEl.addEventListener('load', onFrameLoaded);
    }

    // Initial render
    renderUI();
  </script>
</body>
</html>
