<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>브랜딩 마켓 | 위라클</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .coming-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon-badge {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: #faf5ff;
      color: #7c3aed;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 24px;
      border: 1px solid #f3e8ff;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      color: #475569;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7c3aed;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    .desc {
      font-size: 14.5px;
      color: #64748b;
      line-height: 1.65;
      margin-bottom: 32px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 13px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
    }
    .btn-primary {
      background: #7c3aed;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #6d28d9;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="coming-card">
    <div class="icon-badge">
      <i class="fa-solid fa-store"></i>
    </div>
    <div>
      <span class="status-pill">
        <span class="status-dot"></span> 서비스 준비 중
      </span>
    </div>
    <h1 class="title">브랜딩 마켓 오픈 준비 중</h1>
    <p class="desc">
      위라클 파트너스 회원을 위한 맞춤형 브랜드 상품과<br>
      마케팅 세일즈 자료 마켓이 현재 준비 중입니다.<br>
      더 완성도 높은 구성으로 곧 찾아뵙겠습니다.
    </p>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="if(window.parent && window.parent.loadSubPage){ window.parent.loadSubPage('브랜딩', '위라클 브랜딩', 'branding/branding.html'); }else{ window.location.href='branding.html'; }">
        <i class="fa-solid fa-arrow-left"></i> 위라클 브랜딩 보기
      </button>
      <button class="btn btn-secondary" onclick="if(window.parent && window.parent.loadSubPage){ window.parent.loadSubPage('홈', '홈', 'home'); }else{ window.location.href='../index.html'; }">
        홈으로 이동
      </button>
    </div>
  </div>

</body>
</html>
