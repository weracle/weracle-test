<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>위라클 모바일 디지털 명함</title>
  <script>
    (function() {
      // 1. URL Path에서 slug 추출 (/c/mycard 형태)
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      let slug = '';
      const cIdx = pathParts.indexOf('c');
      if (cIdx !== -1 && pathParts.length > cIdx + 1) {
        slug = pathParts[cIdx + 1];
      }
      // 2. Query 파라미터에서 추출 (?u=mycard)
      if (!slug) {
        const params = new URLSearchParams(window.location.search);
        slug = params.get('u') || params.get('slug') || '';
      }
      // 3. Hash에서 추출 (#mycard)
      if (!slug && window.location.hash) {
        slug = window.location.hash.replace('#', '').replace('/', '');
      }

      const target = '../card/card.html' + (slug ? '?u=' + encodeURIComponent(slug) : '');
      window.location.replace(target);
    })();
  </script>
</head>
<body style="background:#f0f9ff; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; font-family:'Pretendard', sans-serif; color:#0284c7;">
  <div style="text-align:center;">
    <div style="font-size:24px; font-weight:800; margin-bottom:8px;">✨ 위라클 디지털 명함</div>
    <div style="font-size:14px; color:#64748b;">명함 페이지로 안전하게 연결 중입니다...</div>
  </div>
</body>
</html>
