<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>손·생보 한장 비교표 - Weracle Insight</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap">
  <style>
    :root {
      --primary: #113f67;
      --primary-hover: #0a253d;
      --title-blue: #0284c7;
      --accent-blue: #0284c7;
      --accent-green: #059669;
      --bg-body: #f5f5f7;
      --border: rgba(0, 0, 0, 0.08);
      --text-main: #1d1d1f;
      --text-sub: #86868b;
      --bg-main: radial-gradient(circle at 50% 30%, #f4f8fc 0%, #e2edf7 100%);
    }

    * {
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      letter-spacing: -0.015em;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-main);
      color: #1e293b;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .font-brand {
      font-family: 'Outfit', 'Pretendard', sans-serif;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* Loader Pulse */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body class="p-3 sm:p-5 flex flex-col h-screen overflow-hidden">

  <!-- Outer Dashboard Window Container (영업소식지 & 타겟관리 공식 벤토박스 디자인 연동) -->
  <div class="rounded-3xl border border-slate-200/80 shadow-2xl overflow-hidden flex flex-col bg-white h-full w-full max-w-[1600px] mx-auto relative" id="mainContainer">
    
    <!-- ============================================================== -->
    <!-- 1. 상단 헤더 & 카테고리 탭 (줄바꿈 없이 한 줄로 컴팩트 고정) -->
    <!-- ============================================================== -->
    <header class="px-4 sm:px-6 py-2.5 border-b border-[#e2e8f0] flex flex-nowrap items-center justify-between bg-white flex-shrink-0 relative z-30 gap-2 sm:gap-3 h-14" style="background: linear-gradient(180deg, #f0f8ff 0%, #ffffff 100%);">
      
      <!-- Left: Title & Brand Icon -->
      <div class="flex items-center flex-shrink-0 whitespace-nowrap">
        <div>
          <h1 class="text-base sm:text-lg font-black text-[#0284c7] tracking-tight">손·생보 한장 비교표</h1>
        </div>
      </div>

      <!-- Center: 4대 카테고리 탭 (클릭 시 해당 카테고리 맞춤 맵만 펼쳐짐) -->
      <div class="flex-1 flex justify-center min-w-0 px-2 overflow-x-auto">
        <div class="flex items-center gap-1 bg-[#f5f5f7] p-1 rounded-2xl border border-[#e2e8f0] shadow-xs flex-nowrap" id="headerTabsContainer">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- Right: Active Sheet Badge, Search & Actions (줄바꿈 방지) -->
      <div class="flex items-center gap-2 flex-shrink-0 whitespace-nowrap">
        <!-- Current Sheet Badge -->
        <div class="hidden 2xl:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white border border-[#e2e8f0] text-xs shadow-xs">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-slate-400 font-medium">열람 중:</span>
          <span id="activeBadgeName" class="text-[#113f67] font-bold"></span>
        </div>

        <!-- Quick Search Toggle / Input -->
        <div class="relative">
          <input type="text" id="quickSearchInput" oninput="onQuickSearch()" placeholder="담보 검색..." class="w-28 sm:w-36 text-xs bg-[#f5f5f7] border border-[#e2e8f0] rounded-xl px-2.5 py-1.5 pl-7 text-[#1d1d1f] placeholder-[#86868b] focus:outline-none focus:border-[#113f67] focus:ring-2 focus:ring-[#113f67]/10 focus:bg-white transition-all">
          <svg class="w-3.5 h-3.5 absolute left-2 top-2 text-[#86868b]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>

        <!-- Guide Button -->
        <button onclick="openGuideModal()" title="한장비교표 기능 사용 가이드" class="px-2.5 sm:px-3 py-1.5 rounded-xl border border-red-200 bg-red-50 hover:bg-red-100 text-xs font-bold text-red-600 hover:text-red-700 shadow-xs cursor-pointer transition-all flex items-center gap-1.5 whitespace-nowrap">
          <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
          <span>사용 가이드</span>
        </button>

        <!-- New Window Action -->
        <button onclick="openCurrentInNewTab()" title="새 창에서 크게보기" class="px-2.5 sm:px-3 py-1.5 rounded-xl border border-[#e2e8f0] bg-white text-xs font-bold text-slate-600 hover:text-[#0284c7] hover:border-[#0284c7] shadow-xs cursor-pointer transition-all flex items-center gap-1.5 whitespace-nowrap">
          <span class="hidden sm:inline">새창 열기</span>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 2-1. 한장비교표 기능 사용 가이드 모달 오버레이 -->
    <!-- ============================================================== -->
    <div id="guideModalOverlay" class="hidden fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-5" onclick="if(event.target===this)closeGuideModal()">

        <iframe id="guideFrame" src="insight_compare_guide.html" class="w-full h-full border-none block"></iframe>
      </div>
    </div>

      <div id="popoverBentoGrid" class="grid gap-3.5">

      </div>

    <!-- ============================================================== -->

          <span class="text-slate-500 font-medium">현재 경로:</span>
          <span id="currentPathText" class="font-extrabold text-[#113f67]"></span>
        </div>
        <div class="flex items-center gap-3 text-slate-400">
          <button onclick="reloadFrame()" class="hover:text-[#0284c7] flex items-center gap-1 font-medium transition-colors cursor-pointer" title="비교표 새로고침">

            새로고침

        </div>
        <iframe id="insightFrame" class="w-full h-full border-none"></iframe>

    </main>

    <!-- ============================================================== -->

        <span>총 70개 핵심 담보 비교 데이터 구축 완료</span>
      </div>
    </footer>

        { name: '고고당대통(고혈압·당뇨·통풍) 진단비 비교 (생보)', url: 'sheets/59_고고당대통(고혈압·당뇨·통풍) 진단비 비교 (생보).html' }
      ]},
      { category: '간편보험', items: [
        { name: '초간편보험 알릴의무 비교 (5년 이내 암)', url: 'sheets/31_초간편보험 알릴의무 비교 (5년 이내 암).html' },
        { name: '간편보험(유병자) 원수사별 라인업 현황 (손·생보)', url: 'sheets/32_간편보험(유병자) 원수사별 라인업 현황 (손·생보).html' },
        { name: '원수사별 분리심사 운영 현황', url: 'sheets/33_원수사별 분리심사 운영 현황.html' },
        { name: '유병자 고·당·지 고지할인 비교 (손보)', url: 'sheets/34_유병자 고·당·지 고지할인 비교 (손보).html' },
        { name: '유병자 고·당·지 고지할인 비교 (생보)', url: 'sheets/35_유병자 고·당·지 고지할인 비교 (생보).html' }
      ]},
      { category: '태아플랜', items: [
        { name: '태아보험 주요 담보별 현황 비교', url: 'sheets/55_태아보험 주요 담보별 현황 비교.html' }
      ]},
      { category: '주택화재', items: [
        { name: '주택화재보험 급배수누출손해 담보 비교', url: 'sheets/53_주택화재보험 급배수누출손해 담보 비교.html' }
      ]},
      { category: '골프보험', items: [
        { name: '골프(홀인원) 보험사별 담보 비교', url: 'sheets/52_골프(홀인원) 보험사별 담보 비교.html' }
      ]}
    ];

    const groups = [
      { name: "건강/질병", cats: ["3대진단비", "3대 치료비/생활비", "수술비", "치아", "종합질병&상해", "기타 치료비"] },
      { name: "생애/간병", cats: ["치매간병", "간병인", "종신", "연금", "태아플랜"] },
      { name: "실손/간편", cats: ["단독실손", "간편보험", "입원일당"] },
      { name: "생활/레저", cats: ["운전자", "주택화재", "골프보험"] }
    ];

    let currentGroup = groups[0].name;
    let currentCat = groups[0].cats[0];
    let currentUrl = menuData.find(c => c.category === currentCat).items[0].url;
    let currentItemName = menuData.find(c => c.category === currentCat).items[0].name;
    let isMapOpen = false;

    function getGroupItemCount(groupName) {
      const g = groups.find(x => x.name === groupName);
      if (!g) return 0;
      let count = 0;
      g.cats.forEach(c => {
        const catObj = menuData.find(m => m.category === c);
        if (catObj && catObj.items) count += catObj.items.length;
      });
      return count;
    }

    // Toggle Category Map Popover
    function toggleCategoryMap(groupName) {
      if (currentGroup === groupName && isMapOpen) {
        isMapOpen = false;
      } else {
        currentGroup = groupName;
        isMapOpen = true;
      }
      renderUI();
    }

    function closeCategoryMap() {
      if (isMapOpen) {
        isMapOpen = false;
        renderUI();
      }
    }

    function selectSheetItem(cat, name, url) {
      currentCat = cat;
      const g = groups.find(x => x.cats.includes(cat));
      if (g) currentGroup = g.name;
      currentItemName = name;
      currentUrl = url;
      isMapOpen = false;
      renderUI();
    }

    // Main Render Function
    function renderUI() {
      // 1. Render Header Category Tabs
      const tabsContainer = document.getElementById('headerTabsContainer');
      tabsContainer.innerHTML = '';
      groups.forEach(g => {
        const isSelected = (g.name === currentGroup);
        const count = getGroupItemCount(g.name);

        const tabBtn = document.createElement('button');
        tabBtn.onclick = (e) => {
          e.stopPropagation();
          toggleCategoryMap(g.name);
        };

        if (isSelected) {
          tabBtn.className = "px-4 py-2 rounded-xl text-xs font-black transition-all cursor-pointer flex items-center gap-1.5 bg-[#0284c7] text-white shadow-sm ring-2 ring-[#0284c7]/20";
          tabBtn.innerHTML = `
            <span>${g.name}</span>
            <span class="text-[10px] px-1.5 py-0.2 rounded-full bg-white/25 text-white font-mono">${count}</span>
            <span class="text-[10px] opacity-80">${isMapOpen ? '▲' : '▾'}</span>
          `;
        } else {
          tabBtn.className = "px-4 py-2 rounded-xl text-xs font-bold transition-all cursor-pointer flex items-center gap-1.5 text-slate-600 hover:text-slate-950 hover:bg-white";
          tabBtn.innerHTML = `
            <span>${g.name}</span>
            <span class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-200/80 text-slate-600 font-mono">${count}</span>
            <span class="text-[10px] opacity-60">▾</span>
          `;
        }
        tabsContainer.appendChild(tabBtn);
      });

      // 2. Update Header Badges and Text
      document.getElementById('activeBadgeName').innerText = currentItemName;
      document.getElementById('currentPathText').innerText = `${currentGroup} > ${currentCat} > ${currentItemName}`;

      // 3. Render Mega Overlay (선택된 카테고리의 소분류들만 벤토 그리드로 정돈)
      const overlay = document.getElementById('categoryMegaOverlay');
      if (isMapOpen) {
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');

        const activeGroupObj = groups.find(g => g.name === currentGroup);
        const totalCount = getGroupItemCount(currentGroup);

        document.getElementById('popoverGroupBadge').innerText = currentGroup;
        document.getElementById('popoverGroupTitle').innerText = `한장비교표 세부 맵 (${totalCount}개 담보)`;

        // In-popover fast group switchers
        const switchers = document.getElementById('popoverGroupSwitchers');
        switchers.innerHTML = '';
        groups.forEach(g => {
          const sBtn = document.createElement('button');
          sBtn.onclick = (e) => {
            e.stopPropagation();
            currentGroup = g.name;
            renderUI();
          };
          if (g.name === currentGroup) {
            sBtn.className = "px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer bg-[#113f67] text-white shadow-xs";
          } else {
            sBtn.className = "px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-600";
          }
          sBtn.innerText = g.name.split('/')[0];
          switchers.appendChild(sBtn);
        });

        // Grid Columns based on count of subcategories
        const grid = document.getElementById('popoverBentoGrid');
        grid.innerHTML = '';
        const colCount = activeGroupObj.cats.length <= 4 ? 'grid-cols-2 md:grid-cols-4' : 'grid-cols-2 md:grid-cols-3 lg:grid-cols-6';
        grid.className = `grid ${colCount} gap-3.5`;

        activeGroupObj.cats.forEach(c => {
          const catObj = menuData.find(x => x.category === c);
          const isSelectedCat = (c === currentCat);

          const card = document.createElement('div');
          card.className = `rounded-2xl border ${isSelectedCat ? 'border-[#bfdbfe] bg-[#eff6ff]/35 shadow-sm' : 'border-slate-200/90 bg-slate-50/70'} p-3.5 flex flex-col gap-2 transition-all`;

          let itemsHtml = catObj.items.map(item => {
            const isItemActive = (item.url === currentUrl);
            return `
              <button onclick="selectSheetItem('${c}', '${item.name}', '${item.url}')" class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs truncate cursor-pointer transition-all flex items-center justify-between ${isItemActive ? 'bg-[#0284c7] text-white font-extrabold shadow-xs' : 'text-slate-600 hover:bg-white hover:text-[#0284c7] hover:shadow-2xs'}">
                <span class="truncate">${item.name}</span>
                ${isItemActive ? '<span class="text-[9px] font-black">열람중</span>' : ''}
              </button>
            `;
          }).join('');

          card.innerHTML = `
            <div class="flex items-center justify-between pb-2 border-b ${isSelectedCat ? 'border-[#bfdbfe]' : 'border-slate-200'}">
              <span class="font-black text-xs ${isSelectedCat ? 'text-[#0284c7]' : 'text-slate-800'}">${c}</span>
              <span class="text-[10px] font-bold px-1.5 py-0.2 rounded-full ${isSelectedCat ? 'bg-white text-[#0284c7] border border-[#bfdbfe]' : 'bg-slate-200 text-slate-600'} font-mono">${catObj.items.length}</span>
            </div>
            <div class="space-y-1">
              ${itemsHtml}
            </div>
          `;
          grid.appendChild(card);
        });

      } else {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      }

      // 4. Update Iframe Source
      const iframe = document.getElementById('insightFrame');
      if (iframe.src !== currentUrl) {
        showLoader();
        iframe.src = currentUrl;
      }
    }

    // Frame Helpers
    function showLoader() {
      const loader = document.getElementById('frameLoader');
      if (loader) {
        loader.classList.remove('hidden');
        loader.style.opacity = '1';
      }
    }

    function onFrameLoaded() {
      const loader = document.getElementById('frameLoader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.classList.add('hidden'), 300);
      }
    }

    function reloadFrame() {
      const iframe = document.getElementById('insightFrame');
      if (iframe) {
        showLoader();
        iframe.src = currentUrl;
      }
    }

    function openCurrentInNewTab() {
      if (currentUrl) {
        window.open(currentUrl, '_blank');
      }
    }

    // Quick Search Logic
    function onQuickSearch() {
      const input = document.getElementById('quickSearchInput');
      const overlay = document.getElementById('searchResultsOverlay');
      const listEl = document.getElementById('searchResultsList');
      const countEl = document.getElementById('searchResultCount');

      const query = (input.value || '').trim().toLowerCase();

      if (!query) {
        overlay.classList.add('hidden');
        return;
      }

      const matches = [];
      menuData.forEach(catObj => {
        catObj.items.forEach(item => {
          if (item.name.toLowerCase().includes(query) || catObj.category.toLowerCase().includes(query)) {
            const grp = groups.find(g => g.cats.includes(catObj.category));
            matches.push({
              group: grp ? grp.name : '',
              category: catObj.category,
              name: item.name,
              url: item.url
            });
          }
        });
      });

      countEl.innerText = matches.length;
      listEl.innerHTML = '';

      if (matches.length === 0) {
        listEl.innerHTML = `<span class="text-xs text-slate-400">일치하는 비교표가 없습니다.</span>`;
      } else {
        matches.forEach(m => {
          const btn = document.createElement('button');
          btn.className = "px-2.5 py-1 rounded-md bg-white border border-[#bfdbfe] text-xs font-semibold text-[#113f67] hover:bg-[#0284c7] hover:text-white transition-all cursor-pointer flex items-center gap-1 shadow-xs";
          btn.innerHTML = `<span class="text-[10px] text-slate-400 font-normal">[${m.category}]</span> <span>${m.name}</span>`;
          btn.onclick = () => {
            selectSheetItem(m.category, m.name, m.url);
            clearQuickSearch();
          };
          listEl.appendChild(btn);
        });
      }

      overlay.classList.remove('hidden');
    }

    function clearQuickSearch() {
      const input = document.getElementById('quickSearchInput');
      const overlay = document.getElementById('searchResultsOverlay');
      input.value = '';
      overlay.classList.add('hidden');
    }

    // Event Listener for Frame Loading
    const frameEl = document.getElementById('insightFrame');
    if (frameEl) {
      frameEl.addEventListener('load', onFrameLoaded);
    }

    // Guide Modal Controls
    function openGuideModal() {
      const modal = document.getElementById('guideModalOverlay');
      if (modal) {
        modal.classList.remove('hidden');
        const frame = document.getElementById('guideFrame');
        if (frame && !frame.src.includes('insight_compare_guide.html')) {
          frame.src = 'insight_compare_guide.html';
        }
      }
    }

    function closeGuideModal() {
      const modal = document.getElementById('guideModalOverlay');
      if (modal) modal.classList.add('hidden');
    }

    // iframe 가이드 닫기 메시지 수신 (file:/// CORS 환경 완벽 대응)
    window.addEventListener('message', (event) => {
      try {
        const data = event.data;
        if (!data) return;
        if (data === 'CLOSE_WERACLE_GUIDE' || data.action === 'CLOSE_WERACLE_GUIDE' || data.type === 'CLOSE_GUIDE_MODAL') {
          closeGuideModal();
        }
      } catch (err) {}
    });

    function openGuideInNewTab() {
      window.open('insight_compare_guide.html', '_blank');
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeGuideModal();
        closeCategoryMap();
      }
    });

    // Initial render
    renderUI();
  </script>
