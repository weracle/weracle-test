<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>위라클</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
    iframe { border: none; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="clipboard-read; clipboard-write; camera; microphone"></iframe>
  <script>
    // [OAuth 연동 보존] 구글 로그인 후 주소창으로 전달된 인증 토큰(hash/search)을 안쪽 final/index.html로 즉시 전달
    const search = window.location.search || '';
    const hash = window.location.hash || '';
    document.getElementById('appFrame').src = '/final/index.html' + search + hash;
  </script>
</body>
</html>
