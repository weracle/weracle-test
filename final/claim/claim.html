<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보험금 청구</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <style>
      body { font-family: 'Pretendard Variable', Pretendard, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f9; }
      .app-container { max-width: 1000px; margin: 0 auto; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; }
      .header-area { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); padding: 30px; text-align: center; color: #fff; }
      .header-area h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
      .header-area p { margin: 10px 0 0; font-size: 15px; opacity: 0.9; font-weight: 400; }
      .content-area { padding: 40px; }
      .step-title { font-size: 22px; font-weight: 800; color: #0284c7; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
      .step-desc { font-size: 15px; color: #666; margin-bottom: 24px; line-height: 1.5; }
      .radio-group { display: flex; flex-direction: column; gap: 12px; }
      .radio-group label { display: block; padding: 18px 20px; background: #f8fbff; border: 2px solid #e1e9f0; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 600; color: #333; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between; }
      .radio-group label:hover { background: #f0f9ff; border-color: #bae6fd; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15); }
      .radio-group label::after { content: '→'; color: #0284c7; font-weight: bold; opacity: 0; transition: opacity 0.2s ease; }
      .radio-group label:hover::after { opacity: 1; }
    </style>
</head>
<body>
    <div class="app-container">
      <div class="header-area">
        <h1>보험금 청구 시스템</h1>
        <p>원하시는 보험 종류를 선택해주세요</p>
      </div>
      <div class="content-area">
        <div class="step-title">청구 분야 선택</div>
        <div class="step-desc">안전하고 빠른 보험금 청구 시스템입니다. 원하시는 청구 분야를 선택해 주세요.</div>
        <div class="radio-group">
          <label onclick="window.location.href='claim_disease.html?v=115084'"> 질병 / 상해 보험</label>
          <label onclick="window.location.href='claim_pet.html?v=115084'"> 펫 보험</label>
          <label onclick="window.location.href='claim_life.html?v=115084'"> 생명보험 질병/재해</label>
          <label onclick="window.location.href='claim_liability.html?v=115084'"> 배상 책임 보험</label>
          <label onclick="window.location.href='claim_property.html?v=115084'"> 재물 보험</label>
        </div>
      </div>
    </div>
</body>
</html>
