<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 실패 안내 - 위라클</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard Variable', Pretendard, sans-serif; }
    body { background: #f8fafc; color: #1e293b; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #ffffff; border-radius: 20px; border: 1px solid #e2e8f0; padding: 40px 32px; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .icon-box { width: 64px; height: 64px; background: #fef2f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: #dc2626; }
    h1 { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
    p { font-size: 14px; color: #64748b; margin-bottom: 24px; line-height: 1.6; }
    .btn-retry { display: block; width: 100%; padding: 14px; background: #113f67; color: #ffffff; text-decoration: none; border-radius: 12px; font-weight: 700; font-size: 15px; border: none; cursor: pointer; transition: 0.2s; }
    .btn-retry:hover { background: #0c2d4a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
    </div>
    <h1>결제가 완료되지 않았습니다</h1>
    <p id="failReason">사용자에 의해 결제가 취소되었거나 카드 승인에 실패하였습니다.<br>다시 시도해주시기 바랍니다.</p>
    <button class="btn-retry" onclick="history.back()">구독 페이지로 돌아가기</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const msg = params.get('message');
    if (msg) {
      document.getElementById('failReason').innerText = decodeURIComponent(msg);
    }
  </script>
</body>
</html>
