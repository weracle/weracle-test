<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>위라클랩 영업소식지 - Smart Gallery V5</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap">
  <style>
    :root {
      --primary: #113f67;
      --primary-hover: #0a253d;
      --title-blue: #0284c7;
      --accent-blue: #0284c7;
      --accent-green: #059669;
      --bg-body: #f5f5f7;
      --bg-panel: #ffffff;
      --border: rgba(0, 0, 0, 0.08);
      --text-main: #1d1d1f;
      --text-sub: #86868b;
      --text-muted: #a1a1a6;
      --bg-main: radial-gradient(circle at 50% 30%, #f4f8fc 0%, #e2edf7 100%);
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.4px;
      margin: 0;
      padding: 0;
      background: var(--bg-main);
      color: #1e293b;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .font-brand {
      font-family: 'Outfit', 'Pretendard', sans-serif;
    }

    /* Weracle Soft Card */
    .weracle-card {
      background: #ffffff;
      border: 1px solid rgba(17, 63, 103, 0.08);
      box-shadow: 0 8px 24px -4px rgba(17, 63, 103, 0.04), 0 2px 6px rgba(17, 63, 103, 0.02);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .weracle-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 35px -8px rgba(17, 63, 103, 0.12), 0 4px 10px rgba(17, 63, 103, 0.03);
      border-color: rgba(2, 132, 199, 0.35);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* Modal Image: Zero top/bottom dead space, locked 100% to vertical height */
    .modal-img-fit {
      height: 100% !important;
      max-height: 100% !important;
      max-width: 100% !important;
      width: auto !important;
      object-fit: contain !important;
      margin: 0 auto !important;
      padding: 0 !important;
      border-radius: 0 !important;
      cursor: zoom-in;
      display: block;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.7);
      transition: transform 0.2s ease;
    }

    /* Zoom Mode: 100% Full Resolution with Smooth Scroll */
    .modal-img-zoom {
      max-height: none !important;
      max-width: 95% !important;
      width: auto !important;
      height: auto !important;
      object-fit: unset !important;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.95);
      cursor: zoom-out;
      margin: 20px auto;
      display: block;
    }
  </style>
</head>
<body class="p-3 sm:p-6">
  
  <!-- Outer Dashboard Window Container -->
  <div class="rounded-3xl border border-slate-200/80 shadow-2xl overflow-hidden max-w-6xl mx-auto flex flex-col bg-white min-h-[820px]">
    
    <!-- ============================================================== -->
    <!-- 1. 상단 헤더 & 카테고리 탭 (타겟관리 공식 컬러 시스템 연동) -->
    <!-- ============================================================== -->
    <header class="px-6 sm:px-8 pt-6 pb-0 flex flex-col gap-4 border-b border-[rgba(0,0,0,0.08)]" style="background: linear-gradient(180deg, #f0f8ff 0%, #ffffff 100%);">
      <div class="flex flex-wrap items-center justify-between gap-4">
        
        <!-- Left Title -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#113f67] to-[#0284c7] flex items-center justify-center text-white shadow-md shadow-[#113f67]/15">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
            </svg>
          </div>
          <div>
            <h1 class="text-xl sm:text-2xl font-black text-[#0284c7] tracking-tight flex items-center gap-2">
              보험사별 최신 영업소식지
            </h1>
          </div>
        </div>

        <!-- Right Quick Controls (Month Selector & Search - 타겟관리 인풋 스타일) -->
        <div class="flex items-center gap-2.5">
          <div class="relative">
            <select id="monthSelector" onchange="onMonthChange()" class="appearance-none bg-[#f5f5f7] border border-[#e2e8f0] text-[#1d1d1f] text-xs font-bold py-2 pl-3.5 pr-8 rounded-xl focus:outline-none focus:border-[#113f67] focus:ring-4 focus:ring-[#113f67]/10 focus:bg-white cursor-pointer transition-all">
              <option value="2026-11" selected>2026년 11월</option>
              <option value="2026-10">2026년 10월</option>
              <option value="2026-09">2026년 09월</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-[#86868b] text-xs">▼</div>
          </div>

          <div class="relative">
            <input type="text" id="searchInput" oninput="onSearchInput()" placeholder="보험사 또는 키워드 검색..." class="w-44 sm:w-56 text-xs bg-[#f5f5f7] border border-[#e2e8f0] rounded-xl px-3.5 py-2 pl-8 text-[#1d1d1f] placeholder-[#86868b] focus:outline-none focus:border-[#113f67] focus:ring-4 focus:ring-[#113f67]/10 focus:bg-white transition-all">
            <svg class="w-3.5 h-3.5 absolute left-2.5 top-2.5 text-[#86868b]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </div>
        </div>

      </div>

      <!-- Main Category Tabs (타겟관리 테마 탭 & 배지 컬러 연동) -->
      <nav class="flex gap-8 border-b border-[#e2e8f0] text-sm font-bold mt-2" id="mainCatTabs">
        <button onclick="switchCategory('손보')" id="catBtn-손보" class="pb-3 text-[#0284c7] border-b-2 border-[#0284c7] flex items-center gap-1.5 transition-all font-bold">
          <span>손보 소식지</span>
          <span id="badge-손보" class="text-xs px-2 py-0.5 rounded-full bg-[#eff6ff] text-[#0284c7] border border-[#bfdbfe] font-semibold">12</span>
        </button>
        <button onclick="switchCategory('생보')" id="catBtn-생보" class="pb-3 text-[#86868b] hover:text-[#1d1d1f] border-b-2 border-transparent transition-all flex items-center gap-1.5 font-bold">
          <span>생보 소식지</span>
          <span id="badge-생보" class="text-xs px-2 py-0.5 rounded-full bg-[#f1f5f9] text-[#64748b] font-semibold">17</span>
        </button>
        <button onclick="switchCategory('주차별')" id="catBtn-주차별" class="pb-3 text-[#86868b] hover:text-[#1d1d1f] border-b-2 border-transparent transition-all flex items-center gap-1.5 font-bold">
          <span>주차별 소식지</span>
          <span id="badge-주차별" class="text-xs px-2 py-0.5 rounded-full bg-[#f1f5f9] text-[#64748b] font-semibold">4</span>
        </button>
        <button onclick="switchCategory('간추린')" id="catBtn-간추린" class="pb-3 text-[#86868b] hover:text-[#1d1d1f] border-b-2 border-transparent transition-all flex items-center gap-1.5 font-bold">
          <span>간추린 소식</span>
          <span id="badge-간추린" class="text-xs px-2 py-0.5 rounded-full bg-[#f1f5f9] text-[#64748b] font-semibold">2</span>
        </button>
      </nav>
    </header>

    <!-- ============================================================== -->
    <!-- 2. 본문 영역: 짤림 없는 100% 클린 표지 그리드 -->
    <!-- ============================================================== -->
    <main class="flex-1 p-6 sm:p-8" style="background: var(--bg-main);">
      
      

      <!-- Companies Cover Grid (object-contain 적용으로 1픽셀도 잘리지 않음) -->
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-5" id="weracleGrid">
        <!-- Rendered by JS -->
      </div>
    </main>

    <!-- ============================================================== -->
    <!-- 3. 대시보드 하단 정보 바 -->
    <!-- ============================================================== -->
    <footer class="bg-white border-t border-slate-200/80 px-8 py-3.5 text-xs text-slate-500 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <span class="font-bold text-[#113f67] font-brand">WERACLE INSIGHT</span>
        <span class="text-slate-300">|</span>
        <span>영업 지원 솔루션</span>
      </div>
      <div class="flex items-center gap-4 text-slate-400 text-xs">
        
      </div>
    </footer>

  </div>

  <!-- ============================================================== -->
  <!-- 4. 위라클 시그니처 와이드 분할 뷰어 (좌측 정보·목차 패널 + 우측 풀사이즈 이미지) -->
  <!-- ============================================================== -->
  <div id="weracleModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-2 sm:p-4 hidden">
    <div class="bg-white rounded-3xl max-w-[1550px] w-full h-[90vh] max-h-[920px] overflow-hidden shadow-2xl flex flex-col md:flex-row border border-white/20 relative">
      
      <!-- ============================================================== -->
      <!-- [좌측 패널] 상단·하단 내용이 통합된 스마트 내비게이션 사이드바 -->
      <!-- ============================================================== -->
      <aside class="w-full md:w-[320px] lg:w-[350px] flex-shrink-0 bg-white border-b md:border-b-0 md:border-r border-slate-200 flex flex-col h-full overflow-hidden z-20 shadow-xs">
        
        <!-- 1. 헤더: 회사 정보 & 닫기 -->
        <div class="p-5 border-b border-slate-200/80 bg-gradient-to-b from-[#f0f8ff] to-white flex-shrink-0">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <span id="mCompanyColorDot" class="w-3.5 h-3.5 rounded-full bg-[#113f67] shadow-xs"></span>
              <span id="mCategoryBadge" class="text-xs font-extrabold px-2 py-0.5 rounded-md bg-[#eff6ff] text-[#0284c7] border border-[#bfdbfe]">
                손보 소식지
              </span>
            </div>
            <!-- 모바일/공통 닫기 버튼 -->
            <button onclick="closeWeracleModal()" class="w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center text-xs font-bold transition-all cursor-pointer">
              ✕
            </button>
          </div>

          <h2 id="mCompanyName" class="text-xl font-black text-[#113f67] tracking-tight mb-1">
            회사명
          </h2>
          <p id="mTopicTitle" class="text-xs text-slate-500 font-medium leading-relaxed truncate">
            2026년 11월호 핵심 영업전략 소식지
          </p>
        </div>

        <!-- 2. 페이지 카운터 & 이전/다음 빠른 이동 버튼 -->
        <div class="px-5 py-3 border-b border-slate-100 bg-slate-50/70 flex items-center justify-between flex-shrink-0">
          <div class="flex items-center gap-2">
            <span id="mPageCountBadge" class="text-xs font-extrabold text-[#0284c7] bg-[#eff6ff] border border-[#bfdbfe] px-2.5 py-1 rounded-lg font-mono">
              01 / 06 PAGE
            </span>
            <span class="text-[11px] text-slate-400 font-medium hidden sm:inline">페이지 선택</span>
          </div>

          <!-- 이전 / 다음 버튼 -->
          <div class="flex items-center gap-1.5">
            <button onclick="slideStep(-1)" class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 text-xs font-bold cursor-pointer transition-all shadow-2xs">
              ❮ 이전
            </button>
            <button onclick="slideStep(1)" class="px-2.5 py-1 rounded-lg bg-[#0284c7] hover:bg-[#0369a1] text-white text-xs font-bold cursor-pointer transition-all shadow-xs">
              다음 ❯
            </button>
          </div>
        </div>

        <!-- 3. 목차 썸네일 리스트 (세로 스크롤) -->
        <div class="flex-1 overflow-y-auto p-4 space-y-2 bg-slate-50/30 min-h-0" id="mVerticalThumbList">
          <!-- Populated by JS -->
        </div>

        <!-- 4. 액션 버튼 덱 (확대보기, 카톡, 이미지 저장, 닫기) -->
        <div class="p-4 border-t border-slate-200 bg-white flex flex-col gap-2 flex-shrink-0">
          <button onclick="toggleZoomMode()" id="mBtnZoom" class="w-full py-2.5 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-all flex items-center justify-center gap-2 cursor-pointer">
            <span id="mZoomIcon">🔍</span> <span id="mZoomText">100% 원본 확대보기</span>
          </button>
          
          <div class="grid grid-cols-2 gap-2">
            <button onclick="shareKakao()" class="py-2.5 px-3 rounded-xl bg-[#fee500] hover:bg-[#fdd835] text-[#191919] text-xs font-bold transition-all flex items-center justify-center gap-1.5 shadow-2xs cursor-pointer">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-5.52 0-10 3.58-10 8 0 2.82 1.83 5.3 4.6 6.7-.2.72-.73 2.62-.84 3.03-.13.51.19.5.4.34.16-.12 2.58-1.74 3.63-2.45.6.08 1.2.13 1.81.13 5.52 0 10-3.58 10-8s-4.48-8-10-8z"/></svg>
              카톡 공유
            </button>
            <button onclick="downloadImage()" class="py-2.5 px-3 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-bold transition-all flex items-center justify-center gap-1.5 shadow-2xs cursor-pointer">
              <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
              이미지 저장
            </button>
          </div>

          <button onclick="closeWeracleModal()" class="w-full py-2 px-3 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold transition-all text-center cursor-pointer mt-0.5">
            뷰어 닫기 (ESC)
          </button>
        </div>

      </aside>

      <!-- ============================================================== -->
      <!-- [우측 캔버스] 상하단 여백 0px 완벽 밀착, 100% 높이 고정 대형 뷰어 -->
      <!-- ============================================================== -->
      <main class="flex-1 h-full bg-slate-950 flex items-center justify-center relative overflow-hidden select-none p-0 m-0 min-h-0">
        
        <!-- 좌측 이전 버튼 (플로팅 화살표) -->
        <button onclick="slideStep(-1)" class="absolute left-3 sm:left-4 top-1/2 -translate-y-1/2 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-black/40 hover:bg-black/70 text-white backdrop-blur-md flex items-center justify-center text-xl font-bold shadow-2xl transition-all z-20 border border-white/20 cursor-pointer" title="이전 페이지">
          ❮
        </button>

        <!-- 소식지 이미지 렌더링 컨테이너 (위아래 여백 0px 고정) -->
        <div id="mCanvasBox" class="w-full h-full flex items-center justify-center relative overflow-hidden p-0 m-0">
          <!-- Real <img> Tag rendered here -->
        </div>

        <!-- 우측 다음 버튼 (플로팅 화살표) -->
        <button onclick="slideStep(1)" class="absolute right-3 sm:right-4 top-1/2 -translate-y-1/2 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-black/40 hover:bg-black/70 text-white backdrop-blur-md flex items-center justify-center text-xl font-bold shadow-2xl transition-all z-20 border border-white/20 cursor-pointer" title="다음 페이지">
          ❯
        </button>

      </main>
        </button>

      </main>

    </div>
  </div>

  <!-- JavaScript Logic & Real Manifest Data -->

    let currentCategory = '손보';
    let activeCompany = null;
    let currentSlide = 0;
    let isZoomed = false;

    // Switch Category Tab (타겟관리 테마 탭 스타일 연동)
    function switchCategory(cat) {
      currentCategory = cat;
      
      // Update Tab Styles
      ['손보', '생보', '주차별', '간추린'].forEach(c => {
        const btn = document.getElementById('catBtn-' + c);
        const badge = document.getElementById('badge-' + c);
        if (c === cat) {
          btn.className = "pb-3 text-[#0284c7] border-b-2 border-[#0284c7] flex items-center gap-1.5 transition-all font-bold";
          if (badge) badge.className = "text-xs px-2 py-0.5 rounded-full bg-[#eff6ff] text-[#0284c7] border border-[#bfdbfe] font-semibold";
        } else {
          btn.className = "pb-3 text-[#86868b] hover:text-[#1d1d1f] border-b-2 border-transparent transition-all flex items-center gap-1.5 font-bold";
          if (badge) badge.className = "text-xs px-2 py-0.5 rounded-full bg-[#f1f5f9] text-[#64748b] font-semibold";
        }
      });

      // Update SubBar Text
      const count = (newsletterDatabase[cat] || []).length;
      const subBarEl = document.getElementById('subBarText'); if (subBarEl) subBarEl.innerText = '';

      renderCards();
    }

    // Render Company Cards (100% object-contain으로 단 1픽셀도 잘리지 않음)
    // 생보1 / 생보2 / 손보 깃허브 업로드 경로 자동 스마트 매핑
    const saengbo1Companies = ['ABL생명', 'DB생명', 'KB라이프', 'KDB생명', '교보생명', '농협생명', '동양생명', '라이나생명'];

    function getNewsImagePath(category, companyName, pagePadded) {
      if (category === '손보') {
        return `news/손보/${companyName}/${pagePadded}.png`;
      }
      if (category === '생보') {
        if (saengbo1Companies.includes(companyName)) {
          return `생보1/${companyName}/${pagePadded}.png`;
        } else {
          return `생보2/${companyName}/${pagePadded}.png`;
        }
      }
      return `news/${category}/${companyName}/${pagePadded}.png`;
    }

    function renderCards() {
      const grid = document.getElementById('weracleGrid');
      grid.innerHTML = '';

      const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const list = (newsletterDatabase[currentCategory] || []).filter(item => {
        if (!query) return true;
        return item.name.toLowerCase().includes(query) || item.title.toLowerCase().includes(query);
      });

      if (list.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-400 text-sm font-medium">
            검색 결과가 없습니다.
          </div>
        `;
        return;
      }

      list.forEach(comp => {
        const card = document.createElement('div');
        card.className = "weracle-card rounded-2xl overflow-hidden cursor-pointer flex flex-col group p-2.5 bg-white";
        card.onclick = () => openSliderModal(comp);

        // 깃허브 업로드 구조에 맞춘 실물 이미지 경로 (손보 / 생보1 / 생보2 자동 인식)
        const imagePath = getNewsImagePath(currentCategory, comp.name, '01');

        card.innerHTML = `
          <!-- 100% PURE CLEAN COVER IMAGE (object-contain으로 완벽하게 온전한 표지 노출) -->
          <div class="relative bg-slate-50 aspect-[210/297] rounded-xl overflow-hidden shadow-xs group-hover:shadow-md transition-all flex items-center justify-center border border-slate-200/80 p-1">
            <!-- <img> 태그: 실물 01.png 렌더링 -->
            <img src="${imagePath}" 
                 alt="${comp.name} 1P 표지" 
                 class="w-full h-full object-contain transition-transform duration-200 group-hover:scale-102"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='news/${currentCategory}/${comp.name}/01.png'; } else { this.style.display='none'; this.nextElementSibling.style.display='flex'; }">
            
            <!-- Fallback Artwork -->
            <div class="w-full h-full p-5 flex-col justify-center items-center text-center text-white/95 select-none pointer-events-none hidden bg-gradient-to-br ${comp.accentBg} rounded-lg">
              <div class="space-y-2">
                <div class="text-[10px] tracking-widest text-white/60 font-mono uppercase">2026 NOVEMBER ISSUE</div>
                <div class="text-base sm:text-lg font-black leading-snug drop-shadow-sm px-2">${comp.title}</div>
              </div>
            </div>
          </div>

          <!-- CARD BOTTOM INFO -->
          <div class="pt-3 pb-1 px-1 flex flex-col gap-1.5">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full shadow-xs" style="background-color: ${comp.brandColor};"></span>
                <span class="font-extrabold text-[#113f67] text-sm tracking-tight">${comp.name}</span>
              </div>
              <span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 font-mono">
                ${comp.pageCount}P ${comp.totalPdfPages ? `(전체 ${comp.totalPdfPages}P)` : ''}
              </span>
            </div>

            <div class="flex items-center justify-between text-xs text-slate-500">
              <span class="truncate text-[11.5px] max-w-[130px] font-medium text-slate-600">${comp.title}</span>
              <span class="text-[#0284c7] font-bold text-[11px] group-hover:translate-x-0.5 transition-transform">
                열람 →
              </span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Open Slider Modal
    function openSliderModal(company) {
      activeCompany = company;
      currentSlide = 0;
      isZoomed = false;
      updateZoomButton();

      document.getElementById('mCompanyName').innerText = company.name;
      document.getElementById('mCompanyColorDot').style.backgroundColor = company.brandColor;
      const catBadge = document.getElementById('mCategoryBadge');
      if (catBadge) catBadge.innerText = `${currentCategory} 소식지`;
      document.getElementById('mTopicTitle').innerText = `${company.name} 11월호 - ${company.title}`;

      updateModalSlide();
      document.getElementById('weracleModal').classList.remove('hidden');
    }

    function closeWeracleModal() {
      document.getElementById('weracleModal').classList.add('hidden');
    }

    function slideStep(step) {
      if (!activeCompany) return;
      const total = activeCompany.pageCount;
      currentSlide = (currentSlide + step + total) % total;
      updateModalSlide();
    }

    function jumpToSlide(idx) {
      if (!activeCompany) return;
      currentSlide = idx;
      updateModalSlide();
    }

    // Toggle Zoom Mode (100% 원본 확대보기)
    function toggleZoomMode() {
      isZoomed = !isZoomed;
      updateZoomButton();
      const canvas = document.getElementById('mCanvasBox');
      const img = document.getElementById('mCurrentSlideImg');
      if (canvas) {
        if (isZoomed) {
          canvas.classList.remove('overflow-hidden');
          canvas.classList.add('overflow-auto');
        } else {
          canvas.classList.remove('overflow-auto');
          canvas.classList.add('overflow-hidden');
        }
      }
      if (img) {
        img.className = isZoomed ? 'modal-img-zoom' : 'modal-img-fit';
      }
    }

    function updateZoomButton() {
      const icon = document.getElementById('mZoomIcon');
      const text = document.getElementById('mZoomText');
      if (isZoomed) {
        icon.innerText = '📐';
        text.innerText = '화면맞춤';
      } else {
        icon.innerText = '🔍';
        text.innerText = '100% 원본 확대보기';
      }
    }

    // Refresh Modal Slide View (상하단 여백 없는 100% 풀사이즈 캔버스 + 좌측 목차)
    function updateModalSlide() {
      const total = activeCompany.pageCount;
      const pageNum = currentSlide + 1;
      const paddedNum = String(pageNum).padStart(2, '0');

      document.getElementById('mPageCountBadge').innerText = `${paddedNum} / ${String(total).padStart(2, '0')} PAGE`;

      // Current Image Path (손보 / 생보1 / 생보2 자동 인식)
      const imagePath = getNewsImagePath(currentCategory, activeCompany.name, paddedNum);

      // Update Center Canvas Box (클릭 시 확대 토글)
      const canvas = document.getElementById('mCanvasBox');
      if (canvas) {
        if (isZoomed) {
          canvas.classList.remove('overflow-hidden');
          canvas.classList.add('overflow-auto');
        } else {
          canvas.classList.remove('overflow-auto');
          canvas.classList.add('overflow-hidden');
        }
      }
      const imgClass = isZoomed ? 'modal-img-zoom' : 'modal-img-fit';

      canvas.innerHTML = `
        <img id="mCurrentSlideImg" 
             src="${imagePath}" 
             alt="${activeCompany.name} ${pageNum}페이지" 
             class="${imgClass}"
             onclick="toggleZoomMode()"
             title="클릭하여 확대/축소"
             onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='news/${currentCategory}/${activeCompany.name}/${paddedNum}.png'; } else { this.style.display='none'; this.nextElementSibling.style.display='flex'; }">
        
        <!-- Fallback when image file is missing -->
        <div class="w-full h-full flex flex-col justify-center items-center text-center text-white/95 p-6 bg-gradient-to-br ${activeCompany.accentBg} hidden rounded-xl">
          <div class="space-y-3">
            <div class="text-xs uppercase tracking-widest text-white/60 font-mono">[ 깃허브 원본 이미지 렌더링 영역 ]</div>
            <h2 class="text-2xl font-black drop-shadow-md leading-tight px-4">${activeCompany.title}</h2>
            <div class="text-xs text-white/70 font-mono">${paddedNum} / ${String(total).padStart(2, '0')} PAGE</div>
            <div class="text-[11px] text-white/50 font-mono mt-2">${imagePath}</div>
          </div>
        </div>
      `;

      // Update Vertical Thumbnails List (좌측 목차 썸네일 리스트)
      const listEl = document.getElementById('mVerticalThumbList');
      if (listEl) {
        listEl.innerHTML = '';
        
        const titleEl = document.createElement('div');
        titleEl.className = "text-[11px] font-bold text-slate-400 uppercase tracking-wider px-1 pb-1";
        titleEl.innerText = `전체 페이지 목차 (${total}P)`;
        listEl.appendChild(titleEl);

        for (let i = 0; i < total; i++) {
          const isActive = (i === currentSlide);
          const pNum = String(i + 1).padStart(2, '0');
          const thumbPath = getNewsImagePath(currentCategory, activeCompany.name, pNum);

          const pageTitle = (i === 0 ? '표지 (핵심 개정)' : (i === 1 ? '주요 담보 개정' : (i === 2 ? '상품 경쟁력 비교' : (i === 3 ? '인수 기준 완화' : (i === 4 ? '추천 맞춤 플랜' : '영업 시책 및 프로모션')))));

          const itemBtn = document.createElement('button');
          itemBtn.onclick = () => jumpToSlide(i);
          itemBtn.className = `w-full p-2 rounded-2xl border transition-all cursor-pointer text-left flex items-center gap-3 ${
            isActive 
              ? 'border-2 border-[#0284c7] bg-[#eff6ff] shadow-xs ring-2 ring-[#0284c7]/15' 
              : 'border-slate-200 hover:border-slate-300 bg-white hover:bg-slate-50 opacity-80 hover:opacity-100'
          }`;

          itemBtn.innerHTML = `
            <div class="w-12 h-16 bg-slate-100 rounded-lg overflow-hidden flex-shrink-0 border ${isActive ? 'border-[#0284c7]' : 'border-slate-200'} flex items-center justify-center relative shadow-2xs">
              <img src="${thumbPath}" class="w-full h-full object-cover object-top" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
              <span class="text-[10px] font-bold text-slate-400 hidden absolute inset-0 items-center justify-center bg-slate-100">${i+1}P</span>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between mb-0.5">
                <span class="text-xs font-bold ${isActive ? 'text-[#0284c7] font-black' : 'text-slate-700'}">${i + 1}페이지</span>
                ${isActive ? '<span class="text-[9px] font-extrabold px-1.5 py-0.2 rounded bg-[#0284c7] text-white">열람중</span>' : ''}
              </div>
              <p class="text-[11px] ${isActive ? 'text-[#0284c7]/90 font-medium' : 'text-slate-500'} truncate">${pageTitle}</p>
            </div>
          `;
          listEl.appendChild(itemBtn);
        }
      }
    }

    function shareKakao() {
      alert(`💬 [${activeCompany.name}] 소식지 ${currentSlide + 1}페이지 이미지가 카카오톡 전송 준비되었습니다.`);
    }

    function downloadImage() {
      const paddedNum = String(currentSlide + 1).padStart(2, '0');
      const imagePath = getNewsImagePath(currentCategory, activeCompany.name, paddedNum);
      const a = document.createElement('a');
      a.href = imagePath;
      a.download = `${activeCompany.name}_202611_${paddedNum}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function onMonthChange() {
      const m = document.getElementById('monthSelector').value;
      const text = m === '2026-11' ? '2026년 11월호 (실물 PDF 29개사 완비)' : (m === '2026-10' ? '2026년 10월호' : '2026년 9월호');
      const mbEl = document.getElementById('headerMonthBadge'); if (mbEl) mbEl.innerText = '';
      renderCards();
    }

    function onSearchInput() {
      renderCards();
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      const modal = document.getElementById('weracleModal');
      if (!modal.classList.contains('hidden')) {
        if (e.key === 'ArrowLeft') slideStep(-1);
        if (e.key === 'ArrowRight') slideStep(1);
        if (e.key === 'Escape') closeWeracleModal();
      }
    });

    // Initial render
    switchCategory('손보');

    // Auto-open parameter for direct view or testing
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('auto')) {
      setTimeout(() => openSliderModal(newsletterDatabase['손보'][0]), 50);
    }
  </script>
</body>
</html>
