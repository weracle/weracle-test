<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>위라클</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
    iframe { border: none; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="/final/index.html" allow="clipboard-read; clipboard-write; camera; microphone"></iframe>
  <script>
    const hash = window.location.hash;
    const search = window.location.search;
    if (hash || search) {
      document.getElementById('appFrame').src = '/final/index.html' + search + hash;
    }
  </script>
</body>
</html>
