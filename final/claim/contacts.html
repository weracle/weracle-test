<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>34개 보험사 고객센터 연락처</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      margin: 0;
      padding: 24px 16px;
      background-color: #f1f5f9;
      color: #1e293b;
    }
    .contacts-container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .header-area {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      padding: 32px 24px;
      text-align: center;
      color: #ffffff;
      position: relative;
    }
    .header-area h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .header-area p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.92;
      font-weight: 400;
    }
    .back-btn {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
      text-decoration: none;
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }
    .controls-area {
      padding: 18px 24px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }
    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 14px;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 13.5px;
      outline: none;
      background: #ffffff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search-box input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .tab-group {
      display: flex;
      gap: 6px;
    }
    .tab-btn {
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #64748b;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .tab-btn:hover {
      background: #f1f5f9;
      color: #1e293b;
      border-color: #94a3b8;
    }
    .tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25);
    }
    .contacts-grid {
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      background: #f8fafc;
      min-height: 380px;
    }
    .contact-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .contact-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
      border-color: #bae6fd;
    }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .card-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 6px;
      background: #ffffff;
      flex-shrink: 0;
    }
    .card-name {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge-nonlife {
      background: #e0f2fe;
      color: #0369a1;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      flex-shrink: 0;
    }
    .badge-life {
      background: #f3e8ff;
      color: #7e22ce;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      flex-shrink: 0;
    }
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px dashed #f1f5f9;
    }
    .phone-number {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.3px;
    }
    .card-actions {
      display: flex;
      gap: 6px;
    }
    .action-btn {
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .btn-call {
      background: #ecfdf5;
      color: #059669;
      border-color: #a7f3d0;
    }
    .btn-call:hover {
      background: #d1fae5;
      color: #047857;
      transform: translateY(-1px);
    }
    .btn-copy {
      background: #f1f5f9;
      color: #475569;
      border-color: #cbd5e1;
    }
    .btn-copy:hover {
      background: #e2e8f0;
      color: #1e293b;
      transform: translateY(-1px);
    }
    .footer-area {
      padding: 16px 24px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #64748b;
    }
    @media (max-width: 640px) {
      .contacts-grid {
        grid-template-columns: 1fr;
        padding: 16px;
      }
      .back-btn span {
        display: none;
      }
      .header-area h1 {
        font-size: 20px;
      }
      .controls-area {
        flex-direction: column;
        align-items: stretch;
      }
      .tab-group {
        justify-content: center;
      }
    }
  </style>
  <script src="../weracle_modal.js"></script>
</head>
<body>

  <div class="contacts-container">
    <div class="header-area">
      <a href="claim.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
        <span>청구 홈으로</span>
      </a>
      <h1><i class="fa-solid fa-phone-volume"></i> 34개 보험사 고객센터 연락처</h1>
      <p>원클릭 바로통화 연결 및 전화번호 복사를 지원합니다.</p>
    </div>

    <div class="controls-area">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="보험사명 또는 전화번호 검색 (예: 삼성, 현대, 1588...)" oninput="filterList()">
      </div>
      <div class="tab-group">
        <button type="button" class="tab-btn active" data-tab="all" onclick="setTab('all')">전체 (34)</button>
        <button type="button" class="tab-btn" data-tab="nonlife" onclick="setTab('nonlife')">손해보험 (13)</button>
        <button type="button" class="tab-btn" data-tab="life" onclick="setTab('life')">생명보험 (21)</button>
      </div>
    </div>

    <div class="contacts-grid" id="contactsGrid">
      <!-- 동적 생성 -->
    </div>

    <div class="footer-area">
      <div id="resultCount">총 <strong>34</strong>개 보험사</div>
      <div>안내: 대표 콜센터 ARS 이용 가능 시간은 평일 09:00~18:00입니다.</div>
    </div>
  </div>

  <script>
    const INSURER_DATA = [
      // --- 손해보험 (13개) ---

      { name: '메리츠화재', type: 'nonlife', phone: '1566-7711', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/c2cae692660c8.png' },
      { name: 'DB손해보험', type: 'nonlife', phone: '1588-0100', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/381ad4a684500.png' },
      { name: 'KB손해보험', type: 'nonlife', phone: '1544-0114', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/c065f97b24fc5.png' },
      { name: '현대해상', type: 'nonlife', phone: '1588-5656', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/87357d8f3595e.png' },
      { name: '한화손해보험', type: 'nonlife', phone: '1566-8000', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/81c5fd45e30c1.png' },
      { name: '롯데손해보험', type: 'nonlife', phone: '1588-3344', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/7d53063ddc47a.png' },
      { name: '흥국화재', type: 'nonlife', phone: '1688-1688', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/79e0f248909c3.png' },
      { name: '하나손해보험', type: 'nonlife', phone: '1566-3000', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/3f61372180e41.png' },
      { name: 'NH농협손해보험', type: 'nonlife', phone: '1644-9000', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/bf3ad594b4f21.png' },
      { name: '라이나원(손보)', type: 'nonlife', phone: '1566-5800', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/935984f4aab4b.png' },
      { name: 'AIG손해보험', type: 'nonlife', phone: '1544-2792', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/da3bebc9fe3e5.png' },
      { name: 'MG손해보험', type: 'nonlife', phone: '1588-5959', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/499a6f93744ae.png' },

      // --- 생명보험 (21개) ---
      { name: '한화생명', type: 'life', phone: '1588-6363', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/841d2709f8a0f.png' },
      { name: '동양생명', type: 'life', phone: '1577-1004', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/8a0361a32f8a5.png' },
      { name: '교보생명', type: 'life', phone: '1588-1001', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/26afb87929732.png' },
      { name: '삼성생명', type: 'life', phone: '1588-3114', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/15a9434e85abb.png' },
      { name: '라이나생명', type: 'life', phone: '1588-0058', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/9c5fe27cead16.png' },
      { name: 'KDB생명', type: 'life', phone: '1588-4040', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/f7dd46a0d892d.png' },
      { name: 'iM라이프', type: 'life', phone: '1588-4770', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/96ba1710e5a9d.png' },
      { name: '미래에셋생명', type: 'life', phone: '1588-0220', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/cec788ecfe510.png' },
      { name: '신한라이프', type: 'life', phone: '1588-5580', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/fb6eb26475156.png' },
      { name: 'KB라이프', type: 'life', phone: '1588-3374', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/2835121bf7f26.png' },
      { name: 'DB생명', type: 'life', phone: '1588-3131', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/6bbd0d0979a39.png' },
      { name: '하나생명', type: 'life', phone: '1577-1112', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/c436fbe95f91c.png' },
      { name: '흥국생명', type: 'life', phone: '1588-2288', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/8f2f2216a57b9.png' },
      { name: 'ABL생명', type: 'life', phone: '1588-6500', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/95e75b52beee4.png' },
      { name: 'IBK연금보험', type: 'life', phone: '1577-4117', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/4bd70e80179db.png' },
      { name: 'NH농협생명', type: 'life', phone: '1544-4000', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/9ea0d2dbfc153.png' },
      { name: 'MetLife', type: 'life', phone: '1588-9600', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/c3d2965579a2c.png' },
      { name: '처브라이프', type: 'life', phone: '1599-4600', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/64f2c0716807d.png' },
      { name: '푸본현대생명', type: 'life', phone: '1577-3311', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/03d4e5f7b698e.png' },
      { name: 'BNP파리바카디프', type: 'life', phone: '1688-1118', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/e8e7681abe44c.png' },
      { name: 'AIA생명', type: 'life', phone: '1588-9898', logoUrl: 'https://cdn.imweb.me/upload/S202508183b244b34709e6/fba6e742bc731.png' }
    ];

    let currentTab = 'all';

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
      });
      filterList();
    }

    function filterList() {
      const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const cleanQuery = query.replace(/[^0-9]/g, '');
      const container = document.getElementById('contactsGrid');
      const countEl = document.getElementById('resultCount');

      const filtered = INSURER_DATA.filter(item => {
        const matchTab = (currentTab === 'all') || (item.type === currentTab);
        if (!matchTab) return false;
        if (!query) return true;
        const cleanPhone = item.phone.replace(/[^0-9]/g, '');
        const matchName = item.name.toLowerCase().includes(query);
        const matchPhone = item.phone.includes(query) || (cleanQuery && cleanPhone.includes(cleanQuery));
        return matchName || matchPhone;
      });

      countEl.innerHTML = query || currentTab !== 'all'
        ? `조회 결과 <strong style="color:#0284c7;">${filtered.length}</strong> / 34개사`
        : `총 <strong style="color:#0284c7;">34</strong>개 보험사`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px 15px; color: #94a3b8;">
            <i class="fa-solid fa-magnifying-glass" style="font-size: 32px; margin-bottom: 12px; opacity: 0.5;"></i>
            <p style="margin: 0; font-size: 15px; font-weight: 600;">일치하는 보험사 또는 전화번호가 없습니다.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="contact-card">
          <div class="card-top">
            <div class="card-info">
              <img class="card-logo" src="${item.logoUrl}" alt="${item.name}" onerror="this.onerror=null; this.style.display='none';">
              <span class="card-name">${item.name}</span>
            </div>
            <span class="${item.type === 'nonlife' ? 'badge-nonlife' : 'badge-life'}">
              ${item.type === 'nonlife' ? '손해보험' : '생명보험'}
            </span>
          </div>
          <div class="card-bottom">
            <div class="phone-number">${item.phone}</div>
            <div class="card-actions">
              <a href="tel:${item.phone}" class="action-btn btn-call" title="전화 걸기">
                <i class="fa-solid fa-phone"></i> 통화
              </a>
              <button type="button" class="action-btn btn-copy" onclick="copyNum('${item.phone}', this)" title="번호 복사">
                <i class="fa-regular fa-copy"></i> 복사
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function copyNum(num, btn) {
      if (!num) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(num).then(() => {
          showFeedback(btn);
        }).catch(() => {
          fallback(num, btn);
        });
      } else {
        fallback(num, btn);
      }
    }

    function fallback(num, btn) {
      try {
        const ta = document.createElement('textarea');
        ta.value = num;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showFeedback(btn);
      } catch (e) {
        alert('전화번호: ' + num);
      }
    }

    function showFeedback(btn) {
      const orig = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-check" style="color:#059669;"></i> 완료!';
      btn.style.borderColor = '#10b981';
      btn.style.background = '#ecfdf5';
      btn.style.color = '#047857';
      setTimeout(() => {
        btn.innerHTML = orig;
        btn.style.borderColor = '';
        btn.style.background = '';
        btn.style.color = '';
      }, 1200);
    }

    filterList();
  </script>
</body>
</html>
