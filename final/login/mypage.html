    <style id="navy-toss-theme">
      /* =========================================
         [ Weracle Partners : Navy Toss Theme ] 
         ========================================= */
      :root {
        --primary: #1e3a8a !important;
        --primary-light: #eff6ff !important;
        --bg-color: #f8fafc !important;
        --card-bg: #ffffff !important;
        --text-main: #191f28 !important;
        --text-sub: #8b95a1 !important;
        --border: #f1f5f9 !important;
        --radius: 20px !important;
      }

      body, .dashboard-layout, .wm-content-area, .weracle-crm-container, .wm-container, .insight-layout, .main-layout {
        background-color: var(--bg-color) !important;
        color: var(--text-main) !important;
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      }
      
      /* Global Layout & Main Containers */
      .layout-container, .app-container, .main-content {
        background-color: var(--bg-color) !important;
      }
      .sidebar {
        background-color: #ffffff !important;
        border-right: 1px solid var(--border) !important;
      }

      /* Header & Tabs */
      .vlab-header-bg, .top-header, .app-header {
        background: transparent !important;
        padding: 20px 40px 10px 40px !important;
        border: none !important;
        box-shadow: none !important;
      }
      .vlab-main-title, .header-title {
        font-size: 26px !important;
        font-weight: 900 !important;
        letter-spacing: -0.5px !important;
        color: var(--text-main) !important;
      }
      .comm-tabs-container {
        background: transparent !important;
        border: none !important;
      }
      .comm-tabs {
        display: inline-flex !important;
        gap: 8px !important;
        background: #ffffff !important;
        padding: 6px !important;
        border-radius: 16px !important;
        box-shadow: 0 4px 15px rgba(0,0,0,0.02) !important;
        border: 1px solid var(--border) !important;
      }
      .comm-tab-btn {
        padding: 12px 20px !important;
        border: none !important;
        background: transparent !important;
        border-radius: 12px !important;
        font-size: 15px !important;
        font-weight: 700 !important;
        color: var(--text-sub) !important;
        transition: all 0.2s ease !important;
      }
      .comm-tab-btn::after { display: none !important; }
      .comm-tab-btn:hover {
        background: #f1f5f9 !important;
        color: var(--text-main) !important;
      }
      .comm-tab-btn.active {
        background: var(--primary) !important;
        color: white !important;
        box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2) !important;
      }

      /* Cards */
      .board-card, .ranking-box, .tab-content > div[style*="background: #ffffff"], .card, .insight-card, .crm-card, .dashboard-card {
        background: var(--card-bg) !important;
        border-radius: var(--radius) !important;
        padding: 24px !important;
        box-shadow: 0 4px 20px rgba(0,0,0,0.03) !important;
        border: 1px solid var(--border) !important;
        transition: transform 0.2s !important;
      }
      
      /* Titles */
      .highlight-title, .card-title, .section-title {
        background: transparent !important;
        border: none !important;
        padding: 0 !important;
        box-shadow: none !important;
        font-size: 18px !important;
        font-weight: 800 !important;
        color: var(--text-main) !important;
        letter-spacing: -0.3px !important;
        margin-bottom: 20px !important;
      }
      .highlight-title::before { content: none !important; }

      /* Buttons */
      .sb-btn, .btn-primary, .btn-secondary, button {
        border-radius: 12px !important;
        font-weight: 700 !important;
        padding: 12px 18px !important;
        transition: all 0.2s ease !important;
        border: none !important;
      }
      .sb-btn-primary, .btn-primary {
        background: var(--primary) !important;
        color: white !important;
        box-shadow: 0 2px 8px rgba(30, 58, 138, 0.2) !important;
      }
      .sb-btn-primary:hover, .btn-primary:hover { transform: translateY(-1px) !important; box-shadow: 0 4px 12px rgba(30, 58, 138, 0.3) !important; }
      .sb-btn-secondary, .btn-secondary {
        background: #f8fafc !important;
        color: var(--text-main) !important;
        border: 1px solid #e2e8f0 !important;
      }
      .sb-btn-secondary:hover, .btn-secondary:hover { background: #f1f5f9 !important; }

      /* Inputs */
      .sb-input, input[type="text"], input[type="password"], input[type="email"], textarea {
        border-radius: 12px !important;
        border: 1px solid #e2e8f0 !important;
        background: #f9fafb !important;
        padding: 12px 16px !important;
        font-size: 14px !important;
        color: var(--text-main) !important;
        outline: none !important;
        transition: 0.2s !important;
      }
      .sb-input:focus, input:focus, textarea:focus {
        border-color: var(--primary) !important;
        background: #ffffff !important;
      }

      /* Notice Banner */
      .soft-flashy-notice {
        background: linear-gradient(135deg, #1e3a8a, #3b82f6) !important;
        border-radius: 20px !important;
        padding: 24px 30px !important;
        border: none !important;
        box-shadow: 0 10px 20px rgba(30, 58, 138, 0.15) !important;
        animation: none !important;
      }
      .soft-flashy-text {
        color: white !important;
        font-size: 24px !important;
        font-weight: 800 !important;
        animation: none !important;
        text-shadow: none !important;
      }
      .soft-flashy-badge {
        background: rgba(255,255,255,0.2) !important;
        color: white !important;
        backdrop-filter: blur(4px) !important;
        border: none !important;
        box-shadow: none !important;
        animation: none !important;
      }
    
      /* Subscription Card Styles */
      .sub-period-card {
        background: #f0f9ff;
        border: 1px solid #bae6fd;
        border-radius: 12px;
        padding: 16px;
        box-sizing: border-box;
      }
      .sub-period-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #e0f2fe;
        padding-bottom: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .dday-pill {
        background: #0284c7;
        color: #ffffff;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        box-shadow: 0 2px 4px rgba(2, 132, 199, 0.25);
      }
      .sub-info-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      @media (max-width: 600px) {
        .sub-info-grid {
          grid-template-columns: 1fr;
        }
      }
      .sub-info-item {
        display: flex;
        justify-content: space-between;
        font-size: 12.5px;
        background: #ffffff;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #e0f2fe;
      }
      .sub-info-item span:first-child {
        color: #64748b;
        font-weight: 600;
      }
      .sub-info-item span:last-child {
        font-weight: 700;
        color: #0f172a;
      }

    </style>

<script>
(function() {
    // iframe 내부에서 실행 중인 경우 아임웹 공통 헤더/푸터 및 레이아웃 마진 강제 제거
    if (window.self !== window.top) {
        const style = document.createElement('style');
        style.textContent = `
            header, footer, #header_wrap, #header, .header, .footer, #footer,
            .main_header, .mobile_header, #mobile_header, .shop_footer,
            .top_header, #header_container, #footer_container, .navbar, .top_menu {
                display: none !important;
            }
            body, html {
                margin: 0 !important;
                padding: 0 !important;
                background: transparent !important;
                overflow-y: auto !important;
                overflow-x: hidden !important;
            }
            /* 아임웹 기본 레이아웃 가로폭 해제 및 공백 제거 */
            .container, .content, #content, .page_content, .main_content, .section_wrap, .row, .col-xs-12 {
                max-width: 100% !important;
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
        `;
        document.head.appendChild(style);
    }

    // 글로벌 백엔드 연결 정보 및 부모 세션 연동 (iframe 대응)
    let sb = window.sb || (window.parent && window.parent.sb);
    let authEvents = window.authEvents || (window.parent && window.parent.authEvents);

    const sbUrl = "https://tjohrovsvgnkrlqhjkwt.supabase.co";
    const sbKey = "sb_publishable_m2fpA60L66F8uGnynEbmvg_BBepUlmR"; // 로컬 백업용

    class MyPageWidget {
        constructor() {
            this.containerId = 'sb-mypage-content-area'; // 변경: 렌더링 타겟을 content-area로 지정
            this.container = null;
            this.activeTab = 'orders'; 
            this.isEditingProfile = false;
            this.selectedAvatarUrl = '';
            this.myPosts = [];
            this.myComments = [];
            this.myOrders = [];
            this.allOrders = [];
            this.activePostCategory = 'all';
            this.activeCommentCategory = 'all';
        }

        init() {
            this.container = document.getElementById(this.containerId);
            if (!this.container) return; 
            
            this.injectStyles();

            // 부모 또는 윈도우의 sb가 준비될 때까지 안전하게 대기
            let retryCount = 0;
            const checkSbAndStart = () => {
                retryCount++;
                sb = window.sb || (window.parent && window.parent.sb);
                authEvents = window.authEvents || (window.parent && window.parent.authEvents);

                if (!sb && window.supabase) {
                    const config = window.SUPABASE_CONFIG || (window.parent && window.parent.SUPABASE_CONFIG);
                    if (config && config.anonKey && config.anonKey !== "YOUR_SUPABASE_ANON_KEY_HERE") {
                        sb = window.supabase.createClient(config.url, config.anonKey);
                    } else {
                        sb = window.supabase.createClient(sbUrl, sbKey);
                    }
                    window.sb = sb;
                }

                if (sb || retryCount > 5) {
                    if (!window.currentUser && window.parent && window.parent.currentUser) {
                        window.currentUser = window.parent.currentUser;
                    }
                    if (!window.currentProfile && window.parent && window.parent.currentProfile) {
                        window.currentProfile = window.parent.currentProfile;
                    }

                    window.authEvents = authEvents || {
                        listeners: {},
                        on(event, callback) {
                            if (!this.listeners[event]) this.listeners[event] = [];
                            this.listeners[event].push(callback);
                        },
                        emit(event, data) {
                            if (this.listeners[event]) {
                                this.listeners[event].forEach(cb => cb(data));
                            }
                        }
                    };
                    authEvents = window.authEvents;

                    this.render();
                    
                    let lastSessionToken = null;
                    if (authEvents && typeof authEvents.on === 'function') {
                        authEvents.on('stateChange', async (data) => {
                            const session = data ? data.session : null;
                            const token = session ? session.access_token : null;
                            
                            if (lastSessionToken === token && this.container.innerHTML.trim() !== "") {
                                return;
                            }
                            lastSessionToken = token;

                            if (data && data.profile) {
                                window.currentProfile = data.profile;
                            }
                            if (data && data.session && data.session.user) {
                                window.currentUser = data.session.user;
                            } else if (sb) {
                                const sessionData = await sb.auth.getSession().catch(() => ({ data: { session: null } }));
                                window.currentUser = sessionData.data.session ? sessionData.data.session.user : null;
                            }
                            this.render();
                        });
                    }
                } else {
                    setTimeout(checkSbAndStart, 50);
                }
            };

            checkSbAndStart();
        }

        injectStyles() {
            const styleId = 'sb-mypage-widget-styles';
            if (document.getElementById(styleId)) return;
            
            const style = document.createElement('style');
            style.id = styleId;
            style.textContent = `
                @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");
                
                #sb-mypage-widget-root {
                    max-width: 100%;
                    padding: 0;
                    --sb-bg-card: #ffffff;
                    --sb-border-glass: #e2edf7;
                    --sb-primary: var(--primary);
                    --sb-secondary: var(--primary);
                    --sb-accent: var(--primary);
                    --sb-txt-primary: var(--primary);
                    --sb-txt-secondary: #516e89;
                    --sb-txt-muted: #8896a7;
                    --sb-border-focus: var(--primary);
                    --sb-primary-glow: rgba(17, 63, 103, 0.15);
                    --sb-secondary-glow: rgba(30, 92, 148, 0.1);
                    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif !important;
                }
                @media (max-width: 768px) {
                    #sb-mypage-widget-root {
                        padding: 0;
                    }
                    .vlab-header-wrap {
                        padding: 10px 0;
                    }
                }

                .vlab-archive-wrapper {
                    max-width: 100%;
                    margin: 0;
                    padding: 15px 20px;
                    color: #2c3a4b;
                }

                /* 헤더 영역 */
                .vlab-header-wrap {
                    display: flex;
                    align-items: center;
                    margin-bottom: 25px;
                    padding: 10px 0 10px 45px;
                    border-bottom: 1px solid #eaeef2;
                }
                .header-left-col {
                    display: flex;
                    align-items: center;
                }
                .header-center-col {
                    display: flex;
                    align-items: center;
                    margin-left: 20px;
                }
                .header-right-col {
                    display: flex;
                    align-items: center;
                    margin-left: auto;
                }
                .vlab-main-title {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    margin: 0;
                }
                
                
                .title-deco-line {
                    position: absolute;
                    left: 0;
                    bottom: -6px;
                    width: 100%;
                    height: 2px;
                    background: linear-gradient(90deg, var(--primary) 0%, #00e6f6 100%);
                    border-radius: 2px;
                }

                #sb-mypage-widget-root .sb-glass-card {
                    background: #ffffff !important;
                    border: 1px solid var(--primary) !important;
                    box-shadow: 0 10px 30px rgba(17, 63, 103, 0.05) !important;
                    color: #2c3a4b !important;
                    text-align: left;
                    border-radius: 20px !important;
                }
                #sb-mypage-widget-root .sb-glass-card:hover {
                    border-color: var(--primary) !important;
                    box-shadow: 0 15px 40px rgba(17, 63, 103, 0.08) !important;
                }

                #sb-mypage-widget-root .sb-mypage-tab-wrap { display: flex; flex-direction: column; }
                #sb-mypage-widget-root .sb-input {
                    background: #f8fafc !important;
                    border: 1px solid #e2edf7 !important;

                    box-sizing: border-box;
                    border-radius: 8px !important;

                    transition: all 0.25s ease !important;

                }
                #sb-mypage-widget-root .sb-input:focus {
                    background: #ffffff !important;

                #sb-mypage-widget-root .form-label {

                #sb-mypage-widget-root .sb-btn-primary {

                #sb-mypage-widget-root .sb-btn-primary:hover {

                #sb-mypage-widget-root .profile-image-wrapper {

                this.renderDashboard();
                return;
            }

            const { data: { session } } = await sb.auth.getSession().catch(() => ({ data: { session: null } }));
            window.currentUser = session ? session.user : null;

            if (!window.currentUser) {
                const isPreview = window.location.search.includes('preview=login') || 
                                  (window.parent && window.parent.location && window.parent.location.search && window.parent.location.search.includes('preview=login')) ||
                                  (window.parent && window.parent.isLoggedIn);
                if (isPreview) {
                    window.currentUser = { email: 'weracle_pro@partners.com' };
                    window.currentProfile = {
                        nickname: '위라클 파트너',
                        company: '위라클 파트너스 본부',
                        phone: '010-8765-4321',
                        user_grade: 'vip',
                        point_balance: 5000,
                        fax_count: 12
                    };
                    this.renderDashboard();
                    return;
                }
                this.renderLoggedOutState();
                return;
            }

            this.renderLoadingState();
            
            try {
                const { data: latestProfile, error: profileErr } = await sb
                    .from('profiles')
                    .select('*')
                    .eq('id', window.currentUser.id)
                    .single();
                if (!profileErr && latestProfile) {
                    window.currentProfile = latestProfile;
                } else {
                    window.currentProfile = window.currentProfile || {
                        nickname: window.currentUser.email.split('@')[0],
                        user_grade: 'basic',
                        avatar_url: 'https://api.dicebear.com/7.x/bottts/svg?seed=' + window.currentUser.id
                    };
                }

                const isManager = window.currentProfile && window.currentProfile.user_grade === 'manager';
                
                const promises = [
                    this.loadMyOrders()
                ];

                if (isManager) {
                    promises.push(this.loadAllOrders());
                }
                
                await Promise.all(promises);
                this.renderDashboard();
                
            } catch (error) {
                console.error("Error loading MyPage data:", error);
                this.container.innerHTML = `

                        데이터를 불러오는 중 오류가 발생했습니다: ${error.message}

        bindEvents() {
            // Hover effect for inline edit buttons
            this.container.querySelectorAll('.sb-btn-inline-edit').forEach(btn => {
                btn.addEventListener('mouseover', (e) => { e.target.style.background = '#f8fafc'; e.target.style.color = '#0284c7'; e.target.style.borderColor = '#0284c7'; });
                btn.addEventListener('mouseout', (e) => { e.target.style.background = '#f1f5f9'; e.target.style.color = '#4b5563'; e.target.style.borderColor = '#cbd5e1'; });
                
                btn.addEventListener('click', async (e) => {
                    const field = e.target.getAttribute('data-field');
                    const profile = window.currentProfile;

                    if (field === 'nickname') {
                        const val = prompt('새로운 닉네임을 입력하세요:', profile.nickname);
                        if (val !== null && val.trim() !== '') this.updateProfileField('nickname', val.trim());
                    } else if (field === 'company') {
                        const val = prompt('새로운 소속을 입력하세요:', profile.company || '');
                        if (val !== null) this.updateProfileField('company', val.trim());
                    } else if (field === 'phone') {
                        const val = prompt('새로운 연락처를 입력하세요:', profile.phone || '');
                        if (val !== null) this.updateProfileField('phone', val.trim());
                    } else if (field === 'avatar') {
                        this.container.querySelector('#sb-avatar-file-input').click();
                    } else if (field === 'logo') {
                        this.container.querySelector('#sb-logo-file-input').click();
                    }
                });
            });

            // Preset avatar click handler
            this.container.querySelectorAll('.sb-preset-avatar').forEach(img => {
                img.addEventListener('click', (e) => {
                    const seed = e.target.getAttribute('data-seed');
                    const url = `https://api.dicebear.com/7.x/lorelei/svg?seed=${seed}`;
                    this.updateProfileField('avatar_url', url);
                });
                img.addEventListener('mouseover', e => e.target.style.transform = 'scale(1.15)');
                img.addEventListener('mouseout', e => e.target.style.transform = 'scale(1)');
            });

            // Avatar file input handler
            const avatarInput = this.container.querySelector('#sb-avatar-file-input');
            if (avatarInput) {
                avatarInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            this.updateProfileField('avatar_url', event.target.result);
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }

            // Logo file input handler
            const logoInput = this.container.querySelector('#sb-logo-file-input');
            if (logoInput) {
                logoInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const img = new Image();
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                const ctx = canvas.getContext('2d');
                                let width = img.width;
                                let height = img.height;
                                if (width > 600) { height = height * (600 / width); width = 600; }
                                canvas.width = width; canvas.height = height;
                                ctx.drawImage(img, 0, 0, width, height);
                                this.updateProfileField('logo_url', canvas.toDataURL('image/png'));
                            };
                            img.src = event.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }
        }

        async updateProfileField(field, value) {
            try {
                const updateData = {};
                updateData[field] = value;
                const { error } = await sb.from('profiles').update(updateData).eq('id', window.currentUser.id);
                if (error) throw error;
                
                if (window.currentProfile) window.currentProfile[field] = value;
                if (window.parent && window.parent.currentProfile) window.parent.currentProfile[field] = value;
                
                if (typeof authEvents !== 'undefined' && authEvents.emit) {
                    authEvents.emit('stateChange', { event: 'PROFILE_UPDATED', session: null, profile: window.currentProfile });
                }
                
                this.render();
            } catch (err) {
                alert("프로필 업데이트 중 오류가 발생했습니다: " + err.message);
            }
        }
















        escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    }

    const myPageWidget = new MyPageWidget();
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => myPageWidget.init());
    } else {
        myPageWidget.init();
    }
})();
</script>

</html>
